<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS TAG</title>
</head>
<body>
   <form>
     <fieldset>
        <legend>Student Form</legend>
        <label for="Name">Name:</label>
        <input type="text" id="Name" placeholder="enter your name😎" minlength="3" maxlength="8" required autofocus value="aravind" readonly>
        <br> <br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" placeholder="enter your gmail📧" disabled>
        <br> <br>
        <label for="Password">Password:</label>
        <input type="password" id="Password" placeholder="enter you password">
        <br> <br>
        <label for="Age">Age:</label>
        <input type="number" id="Age" min="18" max="30" step="2">
        <br> <br>
        <label for="phone">Phone:</label>
        <input type="tel">
        <br> <br>
        <label for="dob">Dob:</label>
        <input type="date">
        <input type="datetime-local">
        <input type="month">
        <input type="time">
        <input type="week">
        <br> <br>
        <!-- TYPE="RADIO" -->
         <label>gender</label>
         <input type="radio" id="male" name="gender" checked>
         <label for="male">male</label>
         <input type="radio" id="female" name="gender">
         <label for="female">female</label>
         <br> <br>
         <!-- TYPE=CHECKBOX -->
          <label>skills</label>
          <input type="checkbox" id="html" checked>
          <label for="html">html</label>
          <input type="checkbox" id="css">
          <label for="css">css</label>
          <input type="checkbox" id="js">
          <label for="js">js</label>
          <input type="checkbox" id="react">
          <label for="react">react</label>
          <br> <br>
          <!-- TYPE=FILE -->
           <label for="photo">upload photo</label>
           <input type="file" id="photo" multiple accept=".pdf">
           <br><br>
           <!-- DROPDOWN -->
          <label for="country">country</label>
          <select id="country">
            <option hidden>select country</option>
            <option value="india" selected>india</option>
            <option value="usa">usa</option>
            <option value="landon">landon</option>
            <option value="germany">germany</option>
            <option value="australia">australia</option>
            <option value="west indies">west indies</option>
            <option value="newzland">newzland</option>
            <option value="south afirca">south afirca</option>
          </select>
          <br> <br>
          <!-- TEXT AREA -->
           <label for="feedback">feedback</label>
           <textarea id="feedback" rows="10" cols="100"></textarea>
          <br> <br>
          <!-- TYPE=COLOUR -->
           <label for="color">select color</label>
           <input type="color" id="color">
           <br> <br>
           <!-- TYPE=RANGE -->
            <label for="range">brightness</label>
            <input type="range" value="10" min="0" max="100" step="15">
            <br><br>
           <!-- TYPE=SUBMIT -->
        <input type="submit" value="register">
        <!-- TYPE=RESET -->
         <input type="reset" value="Clear">
         <br><br>
         
          </fieldset>
   </form>
</body>
</html>
