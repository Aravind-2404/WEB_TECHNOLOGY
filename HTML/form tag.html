<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    
    <fieldset>
        <h1>Join If You Dare💀</h1>
    <label for="name">name:</label>
    <input type="text" id="name" placeholder="Enter your name">
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter valid email">
    <br><br>
    <label for="password">Password:</label>
    <input type="text" id="message">
    <br> <br>
    <label for="number">Phone:</label> 
    <input type="tel">
    <br><br>
    <label for="Experience level">Experience Level:</label>
    <input type="number" id="Experience level" min="2" max="10">
    <br><br>
    <label>Gender:</label>
        <input type="radio" name="gender" value="male" id="male">
    <label for="male">Male</label>
    <input type="radio" name="gender" value="female" id="female">
    <label for="female">Female</label>
    <input type="radio" name="gender" value="Perfer Debugging" id="Perfer Debugging">
    <label for="Perfer Debugging">Prefer Debugging</label>
    <br><br>
    <label>Skills:</label>
    <input type="checkbox" name="skills" value="HTML" id="HTML">
    <label for="HTML">HTML</label>
    <input type="checkbox" name="skills" value="CSS" id="CSS">
    <label for="CSS">CSS</label>
    <input type="checkbox" name="skills" value="JavaScript" id="JavaScript">
    <label for="JavaScript">JavaScript</label>
    <input type="checkbox" name="skills" value="Copy-Paste Engineering😎" id="Copy-Paste Engineering">
    <label for="Copy-Paste Engineering">Copy-Paste Engineering😎</label>
    <br> <br>
    <label for="select mode">Select Mode:</label>
    <select id="select mode">
      <optgroup label="offline">
        <option>Attend Physically</option>
      </optgroup>
      <optgroup label="online">
        <option>Camera Off mode</option>
      </optgroup>
    </select>
    <br><br>
     <label for="choose city">Choose city:</label>
     <select id="choose city">
        <option >Hyderabad</option>
        <option >Bangalolre</option>
        <option >mars(future dev)</option>
     </select>
     <br><br>
     <label for="upload portfolio">Upload Portfolio:</label>
     <input type="file" id="upload portfolio">
     <br> <br.
     <label for="feedback">why should we select you?</label>
     <textarea id="feedback"></textarea>
     <br><br>
        <input type="submit" value="Enter Bootcamp">
        <input type="reset" value="Restart Life">
    </fieldset>
</body
</html>
